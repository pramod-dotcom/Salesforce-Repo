<template>
     <lightning-card  title="This is my component">
            <div class="slds-p-around_medium lgc-bg">
            <lightning-input type="text" label="Enter some text" onchange={changehandler}></lightning-input>
             <lightning-button variant="success" label="Add" title="Successful action"
              onclick={handleClick} class="slds-m-left_x-small"></lightning-button>
    <template for:each={myarray} for:item="item">
        <p key={item.id}>{item}</p>
    </template>
            
        </div>
        </lightning-card>
</template>
